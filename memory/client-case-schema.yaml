version: 1
schema_id: client_case
project: first-us-home
purpose: >
  Canonical operational state for one real user case. This is the primary
  runtime object the agent must load, update, checkpoint, and resume.

global_rules:
  one_case_one_state_object: true
  progress_tracker_is_derived_view: true
  store_safe_summaries_only: true
  do_not_store_raw_sensitive_documents: true
  use_evidence_records_for_material_facts: true
  use_tasks_for_pending_work: true
  require_next_action_after_each_checkpoint: true

enums:
  path:
    - classic
    - creative_finance
    - compare_both
  status:
    - open
    - not_started
    - in_progress
    - waiting_user
    - waiting_external
    - needs_review
    - blocked
    - done
    - paused
  property_stage:
    - new_lead
    - intake_started
    - verifying
    - under_review
    - needs_professional_review
    - ready_for_offer_prep
    - offer_submitted
    - under_contract
    - rejected
    - paused
    - closed
    - no_go
  artifact_status:
    - draft
    - updated
    - needs_review
    - final_for_user
  risk_level:
    - low
    - medium
    - high
    - critical

case_identity:
  case_id: null
  created_at: null
  updated_at: null
  owner_user_label: null
  case_status: in_progress
  active_path: compare_both
  summary: null

profile:
  target_state: null
  target_city: null
  target_counties: []
  intended_use: unknown
  target_purchase_year: 2026
  first_time_buyer: true
  employment_type: unknown
  income_range: null
  credit_score_range: null
  available_cash_range: null
  comfortable_monthly_payment: null
  major_debts_summary: null
  household_size: null
  timeline: null
  risk_tolerance: unknown
  preferred_property_types: []
  constraints_summary: []

learning:
