      last_updated: null
      summary: null

risks:
  active:
    - risk_id: null
      category: null
      severity: medium
      related_subjects: []
      summary: null
      mitigation: null
      status: open
  resolved: []

tasks:
  primary_next_action: null
  secondary_actions: []
  backlog:
    - task_id: null
      type: null
      status: open
      priority: medium
      related_subjects: []
      depends_on: []
      due_date: null
      done_definition: null
      owner: agent
      notes: null

session:
  last_session_date: null
  last_checkpoint_type: null
  last_completed_actions: []
  open_questions: []
  stale_items: []
  next_actions: []
  memory_update_summary: null

privacy_rules:
  do_not_store:
    - full Social Security numbers
    - bank account numbers
    - passwords
    - full tax returns
    - full loan applications
    - sensitive identity documents
  prefer_ranges_for:
    - income
    - credit score
    - available cash
    - debt totals

done_definition:
  case_is_operational_when:
    - profile has enough detail to select a path
    - active tasks exist for unresolved work
    - material facts are linked to evidence or marked unknown
    - at least one next action is defined
  case_is_stable_for_long_running_use_when:
    - checkpoints are created after milestones
    - stale items can be identified
    - artifacts are versioned instead of recreated
